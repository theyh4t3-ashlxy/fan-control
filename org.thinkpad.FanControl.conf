<!-- org.thinkpad.FanControl.conf -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- root owns the service -->
  <policy user="root">
    <allow own="org.thinkpad.FanControl"/>
    <allow send_destination="org.thinkpad.FanControl"/>
  </policy>

  <!-- anyone on the system can yell at the fan daemon -->
  <policy context="default">
    <allow send_destination="org.thinkpad.FanControl"/>
  </policy>
</busconfig>
